# Copy to config.local.toml (ignored by git) and point it at your own files.

# Splatoon Raiders (Switch 2), already extracted to loose folders: no keys are needed. These paths are a note of
# where your dump lives; the Raiders build takes them on the command line (README.md, docs/building.md).
[raiders]
exefs = 'D:\Dumps\Raiders\base\exefs'
romfs = 'D:\Dumps\Raiders\base\romfs'
update_exefs = 'D:\Dumps\Raiders\update\exefs'
update_romfs = 'D:\Dumps\Raiders\update\romfs'

[work]
# Extracted files, generated C and builds go here.
dir = 'build'

# The [input] section below is read only by the NSP/XCI extraction tools inherited from TotK Recomp and DKB Recomp
# (tools/extract.py, tools/extract_fonts.py, tests/installer_e2e.py). Raiders does not use it.
# [input]
# base = 'C:\Games\TotK\base.nsp'
# updates = ['C:\Games\TotK\update-1.4.3.nsp']
# Keys dumped from your own console. Never printed or copied by the tools.
# keys = 'C:\Switch\prod.keys'
# Optional: a firmware NCA directory; tools/extract_fonts.py takes the system shared fonts from it.
# firmware = 'C:\Switch\firmware'
